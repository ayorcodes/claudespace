[project]
name = "claudespace"
version = "0.1.0"
description = "Open a Claude Code multi-pane iTerm2 workspace with one command (macOS only)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "iterm2>=2.10",
]
classifiers = [
    "Operating System :: MacOS :: MacOS X",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
]

[project.scripts]
claudespace = "claudespace.cli:main"
"claudespace-sync-assets" = "claudespace.assets_sync:main"
"claudespace-handoff" = "claudespace.handoff:main"
"claudespace-guard" = "claudespace.guard:main"
"claudespace-msg" = "claudespace.messaging:main"
"claudespace-update" = "claudespace.update:main"
"claudespace-tmux-persist" = "claudespace.backends.tmux_persist:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["claudespace*"]

[tool.setuptools.package-data]
"claudespace.assets" = [
    "commands/*.md",
    "prompts/*.md",
    "tmux-plugins/**/*.sh",
    "tmux-plugins/**/*.tmux",
    "tmux-plugins/**/*.md",
]
